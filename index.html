<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>若婷学习闯关空间 · 五四制全科互动系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-huyisi">
  <!-- 顶部圆弧胶囊导航舱（桌面端一体悬浮胶囊，移动端超薄双层圆润岛屿） -->
  <header class="topbar">
    <div class="topbar-row-top">
      <div class="brand" onclick="resetToDrillStart()" title="返回首页第1步">
        <img src="/assets/huyisi_welcome.jpg" alt="狐伊丝" class="brand-mascot-avatar" />
        <div class="brand-text-wrap">
          <h1 class="brand-title">若婷学习舱</h1>
        </div>
      </div>

      <nav class="nav-tabs" aria-label="主导航">
        <button class="nav-tab active" data-tab="macro" onclick="switchTab('macro')" title="选课闯关">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span>闯关</span>
        </button>
        <button class="nav-tab" data-tab="mastermap" onclick="switchTab('mastermap')" title="九科王牌提分宝典·高频必背底子+题型答题SOP+红字易错排雷·线上标记知识导图与A4打印">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          <span>宝典导图</span>
        </button>
        <button class="nav-tab" data-tab="phonics" onclick="switchTab('phonics')" title="英语自然拼读与48国际音标点读闯关">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          <span>音标</span>
        </button>
        <button class="nav-tab" onclick="openSubjectPaperGenerator(STATE.homeSelectedSubject || '数学', STATE.stageFocus)" title="九科按单元自动出题·导出Word/Markdown·A4打印">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          <span>组卷</span>
        </button>
        <button class="nav-tab" data-tab="qbank" onclick="switchTab('qbank')" title="可添加题库管理·按考点题型筛选·A4打印与导出">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>题库</span>
        </button>
        <button class="nav-tab" data-tab="exam" onclick="switchTab('exam')" title="错题与习惯">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span>错题</span>
        </button>
        <button class="nav-tab" data-tab="charts" onclick="switchTab('charts')" title="成长进度">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>进度</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <div id="hudStatusCapsules" class="hud-capsules-wrap"></div>
        <div id="globalStageBar" class="stage-bar-wrap"></div>
        <div class="global-search-wrap">
          <svg class="search-prefix-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="globalSearchInput" placeholder="搜考点/口诀" oninput="handleGlobalSearch(this.value)" />
        </div>
        <button id="bgmToggleBtn" class="hud-icon-btn is-bgm-active" onclick="toggleCandyBgm()" title="切换欢快糖果背景音乐 (点击开启/暂停)" aria-label="背景音乐">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </button>
        <button id="bgmNextTrackBtn" class="hud-icon-btn" onclick="switchNextCandyBgmTrack()" title="切换下一首糖果屋背景曲目（共4首轮播）" aria-label="切换下一首曲目">
          <svg class="ui-svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
        <button id="soundToggleBtn" class="hud-icon-btn" onclick="toggleSoundEffects()" title="切换糖果消除特效音" aria-label="切换音效">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <button id="topbarPrintBtn" class="hud-icon-btn topbar-print-pill" onclick="printCurrentActivePage()" title="A4 打印或存为 PDF（支持当前所有页面）" aria-label="打印当前页">
          <svg class="ui-svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          <span class="topbar-print-label">打印</span>
        </button>
        <button class="btn-lucky-quest" onclick="launchDaily25MinRoutine()" title="一键启动今日 25 分钟放学闭环（到期错题复盘 ➔ 初一上同步闯关 ➔ 错因打卡）">
          <svg class="ui-svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          <span>25分钟闭环</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容容器 -->
  <main class="main-container">
    <!-- 视图 1：选课闯关 -->
    <section id="view-macro" class="view-section active"></section>

    <!-- 视图 2：全库搜索与知识点筛选 -->
    <section id="view-meso" class="view-section"></section>

    <!-- 视图 3：成长进度看板 -->
    <section id="view-charts" class="view-section"></section>

    <!-- 视图 4：错题本、习惯护盾与试卷原图 -->
    <section id="view-exam" class="view-section"></section>

    <!-- 视图 5 & 6 & 7 & 8：基因库、教材大纲、英语自然拼读音标舱、可添加题库中心 -->
    <section id="view-genes" class="view-section"></section>
    <section id="view-syllabus" class="view-section"></section>
    <section id="view-phonics" class="view-section"></section>
    <section id="view-qbank" class="view-section"></section>
    <section id="view-mastermap" class="view-section"></section>
  </main>

  <!-- 一道题一道题弹出式快速检测舱 (One-by-One Rapid Quiz Modal) -->
  <div id="quizModalBackdrop" class="quiz-modal-backdrop" onclick="closeHuyisiQuizModal(event)">
    <div id="quizModalCard" class="quiz-modal-card" onclick="event.stopPropagation()">
      <div id="quizModalContent"></div>
    </div>
  </div>

  <!-- 淄博五四制各年级在读科目说明与课表自定义校准弹窗 -->
  <div id="curriculumModalBackdrop" class="quiz-modal-backdrop" onclick="closeCurriculumModal(event)">
    <div class="quiz-modal-card" style="max-width:780px;padding:22px 24px;overflow-y:auto;" onclick="event.stopPropagation()">
      <div id="curriculumModalContent"></div>
    </div>
  </div>

  <!-- 微观知识点详情抽屉 -->
  <div id="microDrawerBackdrop" class="drawer-backdrop" onclick="closeMicroDrawer()"></div>
  <aside id="microDrawer" class="micro-drawer">
    <div id="microDrawerContent"></div>
  </aside>

  <!-- 原图高清放大与旋转检视弹窗 -->
  <div id="photoModal" class="photo-modal" onclick="closePhotoModal(event)">
    <div class="photo-modal-toolbar" onclick="event.stopPropagation()">
      <span id="photoModalTitle" class="photo-modal-title">原图检视</span>
      <div class="photo-modal-btns">
        <button onclick="rotateLightbox(-90)" title="左旋90°">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
        <button onclick="rotateLightbox(90)" title="右旋90°">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
        </button>
        <button onclick="zoomLightbox(0.25)" title="放大">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button onclick="zoomLightbox(-0.25)" title="缩小">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button onclick="resetLightbox()" title="1:1复位">1:1</button>
        <button class="close-btn" onclick="closePhotoModal()" title="关闭">
          <svg class="ui-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="photo-modal-body" onclick="event.stopPropagation()">
      <img id="photoModalImg" src="" alt="试卷原图" />
    </div>
  </div>

  <!-- 右下角轻量化快捷练习按钮 -->
  <div class="huyisi-floating-widget" id="huyisiFloatingWidget" title="开启快速练习">
    <div class="huyisi-float-avatar-wrap" onclick="openHuyisiQuizModal()">
      <img src="/assets/huyisi_welcome.jpg" id="huyisiFloatImg" alt="狐伊丝" />
      <span class="huyisi-float-badge">
        <svg class="ui-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        快测
      </span>
    </div>
  </div>

  <!-- 撒花特效层 -->
  <div id="confettiContainer" class="confetti-container"></div>

  <!-- 全局轻提示 Toast -->
  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
  <script src="/phonics.js"></script>
  <script src="/paper_generator.js"></script>
  <script src="/archetype_qbank.js"></script>
  <script src="/zibo54_unit_templates.js"></script>
  <script src="/master_compendium_data.js"></script>
  <script src="/master_compendium_ui.js"></script>
</body>
</html>
